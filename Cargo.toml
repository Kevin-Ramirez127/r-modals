[package]
name = "r-modals"
version = "0.2.0"
edition = "2021"
description = "Instant modals for Rust — searchable option picker with icons and themes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kevin-Ramirez127/r-modals"
homepage = "https://github.com/Kevin-Ramirez127/r-modals"
readme = "README.md"
keywords = ["modal", "launcher", "gui", "dmenu", "picker"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.32"
image = "0.25"
lightningcss = "1.0.0-alpha.72"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]

[[bin]]
name = "r-modals"
path = "src/bin/r-modals.rs"

[features]
default = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
