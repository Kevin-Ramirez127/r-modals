[package]
name = "quick-modals"
version = "0.1.0"
edition = "2021"
description = "Instant modals for Rust — searchable option picker with icons and themes"
license = "MIT OR Apache-2.0"
keywords = ["modal", "launcher", "gui"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.32"
image = "0.25"

[dev-dependencies]

[features]
default = []
